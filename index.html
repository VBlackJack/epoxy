<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151c" />
    <title data-i18n="app.header.title.label"></title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Drag & Drop Overlay for .DAT / .CCL / .JSON / .XSB files -->
      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-card">
          <div data-i18n="app.packs.drop_overlay.label"></div>
          <div class="drop-card-formats" data-i18n="app.packs.import_formats.label"></div>
        </div>
      </div>

      <header class="top-bar">
        <div class="brand-group">
          <h1 class="brand-title" data-i18n="app.header.title.label"></h1>
          <span class="brand-subtitle" data-i18n="app.header.subtitle.label"></span>
          <div class="mobile-header-actions">
            <button id="btn-mobile-fullscreen" class="nav-btn mobile-fs-toggle" type="button" data-i18n="hud.mobile.fullscreen.action"></button>
            <button id="btn-mobile-menu" class="nav-btn mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="options-drawer" data-i18n="app.header.mobile_menu.action"></button>
          </div>
        </div>

        <nav id="top-controls-drawer" class="top-controls">
          <div class="top-controls-row">
            <div class="pack-box">
              <label for="pack-select" data-i18n="app.packs.selector_label.label"></label>
              <select id="pack-select" class="locale-select" data-pack-select></select>
              <button id="btn-levels-modal" class="nav-btn" type="button" data-i18n="app.header.levels_btn.action"></button>
              <button id="btn-procedural-pack" class="nav-btn" type="button" data-i18n="app.header.procedural_btn.action"></button>
              <button id="btn-import-pack" class="nav-btn" type="button" data-i18n="app.packs.import_btn.action" data-i18n-title="app.packs.import_formats.label"></button>
              <button id="btn-delete-imported-packs" class="nav-btn hidden" type="button" data-i18n="app.packs.delete_all_btn.action" data-i18n-title="app.packs.delete_all_btn.title"></button>
              <input id="pack-file-input" type="file" multiple accept=".dat,.ccl,.json,.xsb,.sok,.xml" class="hidden" />
            </div>
            <div id="procedural-seed-box" class="pack-box procedural-seed-box hidden">
              <span id="procedural-seed-label" class="procedural-seed-label"></span>
              <button id="btn-copy-seed" class="nav-btn" type="button" data-i18n="app.packs.procedural_seed_copy.action"></button>
            </div>
          </div>
          <div class="top-controls-row">
            <div class="mode-switch-group">
              <button id="btn-mode-play" class="nav-btn active" type="button" data-i18n="app.header.mode_play.action"></button>
              <button id="btn-mode-editor" class="nav-btn" type="button" data-i18n="app.header.mode_editor.action"></button>
            </div>
            <div class="top-controls-end">
              <button id="btn-fullscreen-toggle" class="nav-btn" type="button" data-i18n="app.header.fullscreen_toggle.action" data-i18n-title="app.header.fullscreen_toggle.hint"></button>
              <button id="btn-help-top" class="nav-btn help-icon-btn" type="button" data-i18n="app.header.help_icon.action" data-i18n-title="app.header.help_btn.hint" data-i18n-aria-label="app.header.help_btn.hint"></button>
              <button id="btn-options-menu" class="nav-btn" type="button" aria-expanded="false" aria-controls="options-drawer" data-i18n="app.header.options_btn.action"></button>
            </div>
          </div>
        </nav>
      </header>

      <!-- SLIDE-OVER OPTIONS DRAWER -->
      <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
      <aside id="options-drawer" class="options-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="options-drawer-title">
        <div class="drawer-header">
          <h3 id="options-drawer-title" data-i18n="app.header.drawer_title.label"></h3>
          <button id="btn-close-drawer" class="hud-btn small" type="button" data-i18n="app.header.drawer_close.action"></button>
        </div>

        <div class="drawer-body">
          <div class="drawer-section drawer-section-navigation">
            <h4 class="drawer-section-title" data-i18n="app.header.drawer_navigation.label"></h4>
            <div class="lang-box drawer-pack-block">
              <label for="drawer-pack-select" data-i18n="app.packs.selector_label.label"></label>
              <select id="drawer-pack-select" class="locale-select" data-pack-select></select>
            </div>
            <div class="drawer-mobile-only">
              <div class="mode-switch-group drawer-mode-switch">
                <button id="btn-drawer-mode-play" class="nav-btn active" type="button" data-i18n="app.header.mode_play.action"></button>
                <button id="btn-drawer-mode-editor" class="nav-btn" type="button" data-i18n="app.header.mode_editor.action"></button>
              </div>
            </div>
            <div id="drawer-seed-box" class="pack-box procedural-seed-box hidden">
              <span id="drawer-seed-label" class="procedural-seed-label"></span>
              <button id="btn-drawer-copy-seed" class="nav-btn" type="button" data-i18n="app.packs.procedural_seed_copy.action"></button>
            </div>
            <button id="btn-drawer-levels" class="nav-btn" type="button" data-i18n="app.header.levels_btn.action"></button>
            <button id="btn-drawer-procedural" class="nav-btn" type="button" data-i18n="app.header.procedural_btn.action"></button>
            <button id="btn-drawer-import" class="nav-btn" type="button" data-i18n="app.packs.import_btn.action"></button>
            <p class="import-formats-hint" data-i18n="app.packs.import_formats.label"></p>
            <button id="btn-help-modal" class="nav-btn" type="button" data-i18n="app.header.help_btn.action"></button>
          </div>

          <div class="drawer-section">
            <h4 class="drawer-section-title" data-i18n="app.header.drawer_essential.label"></h4>
            <div class="lang-box">
              <label for="select-graphics-style" data-i18n="app.header.graphics_style.label"></label>
              <select id="select-graphics-style" class="locale-select"></select>
            </div>
            <div class="lang-box">
              <label for="fov-select" data-i18n="app.header.fov.label"></label>
              <select id="fov-select" class="locale-select"></select>
            </div>
            <button id="btn-sfx-toggle" class="nav-btn active" type="button"></button>
            <div id="sfx-volume-row" class="lang-box volume-row">
              <label for="sfx-volume-slider" data-i18n="app.header.sfx_volume.label"></label>
              <input id="sfx-volume-slider" class="volume-slider" type="range">
              <output id="sfx-volume-output" class="volume-output" for="sfx-volume-slider" aria-hidden="true"></output>
            </div>
            <button id="btn-music-toggle" class="nav-btn" type="button"></button>
            <div id="music-volume-row" class="lang-box volume-row">
              <label for="music-volume-slider" data-i18n="app.header.music_volume.label"></label>
              <input id="music-volume-slider" class="volume-slider" type="range">
              <output id="music-volume-output" class="volume-output" for="music-volume-slider" aria-hidden="true"></output>
            </div>
            <div class="lang-box">
              <label for="locale-select" data-i18n="app.header.language.label"></label>
              <select id="locale-select" class="locale-select"></select>
            </div>
          </div>

          <details id="drawer-advanced" class="drawer-section drawer-advanced">
            <summary class="drawer-section-title" data-i18n="app.header.drawer_advanced.label"></summary>
            <div class="lang-box">
              <label for="quality-select" data-i18n="app.header.quality.label"></label>
              <select id="quality-select" class="locale-select"></select>
            </div>
            <div class="lang-box">
              <label for="theme-select" data-i18n="app.header.theme_label.label"></label>
              <select id="theme-select" class="locale-select"></select>
            </div>
            <div class="lang-box">
              <label for="player-skin-select" data-i18n="app.header.player_skin.label"></label>
              <select id="player-skin-select" class="locale-select"></select>
            </div>
            <button id="btn-lcd-toggle" class="nav-btn" type="button" data-i18n="app.header.lcd_toggle.action" data-i18n-title="app.header.lcd_toggle.hint"></button>
            <p id="lcd-toggle-reason" class="hint-text hidden" data-i18n="app.header.lcd_toggle.unavailable"></p>
            <button id="btn-sokoban-skin-toggle" class="nav-btn" type="button" data-i18n="app.header.sokoban_skin_toggle.action" data-i18n-title="app.header.sokoban_skin_toggle.hint"></button>
            <div id="music-mode-row" class="lang-box">
              <label for="music-mode-select" data-i18n="app.music.mode.label"></label>
              <select id="music-mode-select" class="locale-select"></select>
            </div>
            <fieldset id="music-custom-tracks" class="music-tracks" hidden>
              <legend data-i18n="app.music.custom_tracks.label"></legend>
              <div class="music-track-list"></div>
            </fieldset>
          </details>
        </div>
      </aside>

      <!-- Floating Exit Fullscreen Pill (visible when Fullscreen Mode hides header) -->
      <button id="btn-exit-fullscreen" class="floating-fs-exit hidden" type="button" data-i18n="hud.mobile.exit_fullscreen.action"></button>

      <!-- PLAY VIEW -->
      <main id="play-view" class="view-section">
        <div id="play-console" class="play-shell">
          <!-- Center Screen Bezel (9x9 Viewport + HUD) -->
          <div class="screen-bezel">
            <div class="lcd-screen">
              <div class="viewport-wrapper">
                <canvas id="game-canvas" width="676" height="676" role="img" data-i18n-aria-label="hud.viewport.canvas.label"></canvas>

                <!-- Hint Overlay -->
                <div id="hint-banner" class="hint-banner hidden" role="status" aria-live="polite">
                  <strong data-i18n="hud.messages.hint_prefix.label"></strong>
                  <span id="hint-text"></span>
                </div>

                <!-- Status Toast Banner -->
                <div id="status-toast" class="status-toast hidden" role="status" aria-live="polite"></div>

                <!-- Tile & Entity Inspection Badge -->
                <div id="inspect-pill" class="inspect-pill hidden"></div>

                <!-- Modal Overlay Inside Viewport (Pause / Death / Win) -->
                <div id="viewport-overlay" class="viewport-overlay hidden" role="alertdialog" aria-labelledby="overlay-title" aria-describedby="overlay-subtitle">
                  <div class="overlay-card">
                    <h2 id="overlay-title"></h2>
                    <p id="overlay-subtitle"></p>
                    <p id="overlay-extra" class="overlay-extra"></p>
                    <div class="overlay-actions">
                      <button id="overlay-btn-resume" class="action-btn primary hidden" type="button" data-i18n="hud.messages.resume_action.action" data-i18n-title="hud.messages.resume_action.hint"></button>
                      <button id="overlay-btn-next" class="action-btn primary hidden" type="button" data-i18n="hud.messages.next_action.action" data-i18n-title="hud.messages.next_action.hint"></button>
                      <button id="overlay-btn-replay" class="action-btn hidden" type="button" data-i18n="hud.messages.replay_action.action"></button>
                      <button id="overlay-btn-undo" class="action-btn" type="button" data-i18n="hud.controls.undo.action" data-i18n-title="hud.controls.undo.hint"></button>
                      <button id="overlay-btn-retry" class="action-btn" type="button" data-i18n="hud.controls.restart.action" data-i18n-title="hud.controls.restart.hint"></button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Ergonomic Smartphone & Touch Controller Bar -->
              <div id="mobile-touch-bar" class="mobile-touch-bar">
                <div class="mobile-dpad-zone">
                  <div class="dpad-container mobile-dpad">
                    <button class="dpad-btn dpad-up" data-dir="N" type="button" data-i18n-aria-label="hud.mobile.dpad_up.label"><span aria-hidden="true">▲</span></button>
                    <button class="dpad-btn dpad-left" data-dir="W" type="button" data-i18n-aria-label="hud.mobile.dpad_left.label"><span aria-hidden="true">◀</span></button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn dpad-right" data-dir="E" type="button" data-i18n-aria-label="hud.mobile.dpad_right.label"><span aria-hidden="true">▶</span></button>
                    <button class="dpad-btn dpad-down" data-dir="S" type="button" data-i18n-aria-label="hud.mobile.dpad_down.label"><span aria-hidden="true">▼</span></button>
                  </div>
                </div>

                <div class="mobile-actions-zone">
                  <div class="mobile-action-grid">
                    <button id="mobile-btn-undo" class="mobile-pad-btn" type="button" data-i18n="hud.mobile.undo.action"></button>
                    <button id="mobile-btn-objective" class="mobile-pad-btn accent" type="button" data-i18n="hud.mobile.objective.action"></button>
                    <button id="mobile-btn-restart" class="mobile-pad-btn" type="button" data-i18n="hud.mobile.restart.action"></button>
                    <button id="mobile-btn-fullscreen" class="mobile-pad-btn" type="button" data-i18n="hud.mobile.fullscreen.action"></button>
                    <button id="mobile-btn-solution" class="mobile-pad-btn span-full" type="button" data-i18n="hud.mobile.solution.action"></button>
                  </div>
                  <div class="mobile-gesture-caption" data-i18n="hud.mobile.gesture_hint.label"></div>
                </div>
              </div>

              <!-- Side HUD Panel -->
              <aside class="hud-panel">
                <div class="hud-level-header">
                  <div class="hud-level-badge">
                    <span data-i18n="hud.stats.level.label"></span>
                    <strong id="hud-level-num"></strong>
                  </div>
                  <button id="hud-password-badge" class="hud-password-badge" type="button" aria-haspopup="dialog" data-i18n-aria-label="hud.controls.password_badge.label" data-i18n-title="hud.controls.password_btn.action">
                    <span data-i18n="hud.stats.password.label"></span>
                    <strong id="hud-level-pass"></strong>
                    <span class="hud-password-edit" aria-hidden="true">&#9998;</span>
                  </button>
                </div>
                <div class="hud-level-title"><span id="hud-level-name" class="hud-level-name"></span><span id="hud-level-author" class="hud-level-author hidden"></span></div>

                <div class="led-counters">
                  <div class="led-box">
                    <span id="hud-chips-label" class="led-label" data-i18n="hud.stats.chips.label"></span>
                    <span id="hud-targets-label" class="led-label hidden" data-i18n="hud.stats.targets.label"></span>
                    <span id="hud-receivers-label" class="led-label hidden" data-i18n="hud.stats.receivers.label"></span>
                    <div id="hud-chips-left" class="led-digits led-green"></div>
                  </div>
                  <div class="led-box">
                    <span class="led-label" data-i18n="hud.stats.time.label"></span>
                    <div id="hud-time-left" class="led-digits led-amber"></div>
                  </div>
                </div>

                <div class="hud-mini-stats">
                  <div>
                    <span data-i18n="hud.stats.score.label"></span>:
                    <strong id="hud-score"></strong>
                  </div>
                  <div>
                    <span data-i18n="hud.stats.steps.label"></span>:
                    <strong id="hud-steps"></strong>
                  </div>
                </div>

                <div class="inventory-row-split">
                  <div class="inventory-section">
                    <div class="inv-title" data-i18n="hud.inventory.keys.label"></div>
                    <div id="hud-keys-grid" class="inv-grid"></div>
                  </div>

                  <div class="inventory-section">
                    <div class="inv-title" data-i18n="hud.inventory.boots.label"></div>
                    <div id="hud-boots-grid" class="inv-grid"></div>
                  </div>
                </div>

                <div class="hud-Quick-actions">
                  <div class="hud-action-grid">
                    <button id="hud-btn-undo" class="hud-btn" type="button" data-i18n="hud.controls.undo.action" data-i18n-title="hud.controls.undo.hint"></button>
                    <button id="hud-btn-objective" class="hud-btn" type="button" data-i18n="hud.controls.objective.action" data-i18n-title="hud.controls.objective.hint"></button>
                    <button id="hud-btn-solution" class="hud-btn" type="button" data-i18n="hud.controls.solution.action" data-i18n-title="hud.controls.solution.hint"></button>
                    <button id="hud-btn-restart" class="hud-btn" type="button" data-i18n="hud.controls.restart.action" data-i18n-title="hud.controls.restart.hint"></button>
                    <button id="hud-btn-options-drawer" class="hud-btn" type="button" data-i18n="app.header.options_btn.action"></button>
                  </div>
                  <div class="hud-nav-row">
                    <button id="hud-btn-prev" class="hud-btn small" type="button" data-i18n="hud.controls.prev_level.action"></button>
                    <button id="hud-btn-pause" class="hud-btn small" type="button" data-i18n="hud.controls.pause.action" data-i18n-title="hud.controls.pause.hint"></button>
                    <button id="hud-btn-next" class="hud-btn small" type="button" data-i18n="hud.controls.next_level.action"></button>
                  </div>
                </div>
                <div class="desktop-key-caption" data-i18n="hud.desktop.key_hint.label"></div>
              </aside>
            </div>
          </div>
        </div>
      </main>

      <!-- LEVEL EDITOR VIEW -->
      <section id="editor-view" class="view-section hidden">
        <div class="editor-layout">
          <div class="editor-left-panel">
            <div class="editor-toolbar">
              <button id="editor-new-btn" class="hud-btn small" type="button" data-i18n="editor.toolbar.new_map.action"></button>
              <button id="editor-undo-btn" class="hud-btn small" type="button" disabled data-i18n="editor.toolbar.undo.action"></button>
              <button id="editor-redo-btn" class="hud-btn small" type="button" disabled data-i18n="editor.toolbar.redo.action"></button>
              <button id="editor-validate-btn" class="hud-btn small" type="button" data-i18n="editor.toolbar.validate_level.action"></button>
              <button id="editor-test-btn" class="hud-btn small primary" type="button" data-i18n="editor.toolbar.test_level.action"></button>
              <button id="editor-save-btn" class="hud-btn small" type="button" data-i18n="editor.toolbar.save_local.action"></button>
              <button id="editor-export-btn" class="hud-btn small" type="button" data-i18n="editor.toolbar.export_json.action"></button>
              <button id="editor-export-ccl-btn" class="hud-btn small" type="button" data-i18n="editor.toolbar.export_ccl.action"></button>
              <button id="editor-import-btn" class="hud-btn small" type="button" data-i18n="editor.toolbar.import_json.action"></button>
              <input id="editor-import-input" type="file" accept=".dat,.ccl,.json,.xsb,.sok,.xml" class="hidden" />
            </div>

            <div class="editor-preset-bar">
              <label for="editor-preset-select" data-i18n="editor.toolbar.load_preset.label"></label>
              <select id="editor-preset-select" class="editor-input"></select>
            </div>

            <div class="editor-preset-bar editor-generator-bar">
              <label for="editor-gen-level" data-i18n="editor.generator.level.label"></label>
              <input id="editor-gen-level" type="number" class="editor-input editor-input-narrow" />
              <label for="editor-gen-seed" data-i18n="editor.generator.seed.label"></label>
              <input id="editor-gen-seed" type="text" inputmode="numeric" class="editor-input" data-i18n-placeholder="editor.generator.seed.placeholder" />
              <button id="editor-generate-btn" class="hud-btn small primary" type="button" data-i18n="editor.generator.generate.action"></button>
            </div>

            <div class="editor-meta-grid">
              <div class="meta-field">
                <label for="editor-meta-title" data-i18n="editor.metadata.title.label"></label>
                <input id="editor-meta-title" type="text" class="editor-input" />
              </div>
              <div class="meta-field">
                <label for="editor-meta-password" data-i18n="editor.metadata.password.label"></label>
                <input id="editor-meta-password" type="text" maxlength="4" class="editor-input" />
              </div>
              <div class="meta-field">
                <label for="editor-meta-time" data-i18n="editor.metadata.time_limit.label"></label>
                <input id="editor-meta-time" type="number" min="0" max="999" class="editor-input" />
              </div>
              <div class="meta-field">
                <label for="editor-meta-chips" data-i18n="editor.metadata.chips_needed.label"></label>
                <div class="inline-field">
                  <input id="editor-meta-chips" type="number" min="0" max="999" class="editor-input" />
                  <button id="editor-autocount-btn" class="hud-btn small" type="button" data-i18n="editor.metadata.auto_count_chips.action"></button>
                </div>
              </div>
              <div class="meta-field full-width">
                <label for="editor-meta-winrule" data-i18n="editor.metadata.win_rule.label"></label>
                <select id="editor-meta-winrule" class="editor-input">
                  <option value="exit" selected data-i18n="editor.metadata.win_rule_exit.label"></option>
                  <option value="targets" data-i18n="editor.metadata.win_rule_targets.label"></option>
                  <option value="receivers" data-i18n="editor.metadata.win_rule_receivers.label"></option>
                </select>
              </div>
              <div class="meta-field full-width">
                <label for="editor-meta-ruleset" data-i18n="editor.metadata.ruleset.label"></label>
                <select id="editor-meta-ruleset" class="editor-input">
                  <option value="epoxy" selected data-i18n="editor.metadata.ruleset_epoxy.label"></option>
                  <option value="lynx" data-i18n="editor.metadata.ruleset_lynx.label"></option>
                </select>
              </div>
              <div class="meta-field full-width">
                <label for="editor-meta-hint" data-i18n="editor.metadata.hint.label"></label>
                <input id="editor-meta-hint" type="text" class="editor-input" />
              </div>
              <div class="meta-field full-width">
                <label for="editor-meta-author" data-i18n="editor.metadata.author.label"></label>
                <input id="editor-meta-author" type="text" class="editor-input" />
              </div>
              <div class="meta-field full-width">
                <label for="editor-meta-dir" data-i18n="editor.metadata.entity_dir.label"></label>
                <select id="editor-meta-dir" class="editor-input">
                  <option value="N" data-i18n="editor.metadata.dir_north.label"></option>
                  <option value="E" data-i18n="editor.metadata.dir_east.label"></option>
                  <option value="S" selected data-i18n="editor.metadata.dir_south.label"></option>
                  <option value="W" data-i18n="editor.metadata.dir_west.label"></option>
                </select>
              </div>
            </div>

            <div id="editor-category-tabs" class="editor-category-tabs"></div>
            <div id="editor-palette-grid" class="editor-palette-grid"></div>
            <div class="editor-status-row">
              <div id="editor-coords-badge" class="editor-coords-badge">--</div>
              <div id="editor-status-bar" class="editor-status-bar" data-i18n="editor.palette.status.ready.label"></div>
            </div>
          </div>

          <div class="editor-canvas-container">
            <canvas id="editor-canvas"></canvas>
          </div>
        </div>
      </section>

      <!-- PASSWORD MODAL -->
      <div id="password-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
        <div class="modal-dialog">
          <h3 id="password-modal-title" data-i18n="hud.password_modal.title.label"></h3>
          <input
            id="password-input"
            type="text"
            maxlength="4"
            class="editor-input password-field"
            data-i18n-placeholder="hud.password_modal.placeholder.label"
            aria-labelledby="password-modal-title"
            aria-describedby="password-error"
          />
          <p id="password-error" class="error-text hidden" role="alert" data-i18n="hud.password_modal.invalid.label"></p>
          <div class="modal-actions">
            <button id="password-submit-btn" class="action-btn primary" type="button" data-i18n="hud.password_modal.submit.action"></button>
            <button id="password-cancel-btn" class="action-btn" type="button" data-i18n="hud.password_modal.cancel.action"></button>
          </div>
        </div>
      </div>

      <!-- PROCEDURAL PACK MODAL -->
      <div id="procedural-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="procedural-modal-title">
        <div class="modal-dialog">
          <h3 id="procedural-modal-title" data-i18n="app.packs.procedural_dialog.title.label"></h3>
          <label for="procedural-seed-input" data-i18n="app.packs.procedural_dialog.seed.label"></label>
          <input
            id="procedural-seed-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            class="editor-input procedural-seed-field"
            data-i18n-placeholder="app.packs.procedural_dialog.seed_placeholder.label"
            aria-describedby="procedural-seed-hint procedural-seed-error"
          />
          <p id="procedural-seed-hint" class="hint-text" data-i18n="app.packs.procedural_dialog.seed_hint.label"></p>
          <p id="procedural-seed-error" class="error-text hidden" role="alert"></p>
          <label for="procedural-start-input" data-i18n="app.packs.procedural_dialog.start_level.label"></label>
          <input
            id="procedural-start-input"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            class="editor-input procedural-seed-field"
            aria-describedby="procedural-start-hint procedural-start-error"
          />
          <p id="procedural-start-hint" class="hint-text"></p>
          <p id="procedural-start-error" class="error-text hidden" role="alert"></p>
          <div class="modal-actions">
            <button id="procedural-submit-btn" class="action-btn primary" type="button" data-i18n="app.packs.procedural_dialog.submit.action"></button>
            <button id="procedural-cancel-btn" class="action-btn" type="button" data-i18n="app.packs.procedural_dialog.cancel.action"></button>
          </div>
        </div>
      </div>

      <!-- LEVEL SELECT & HIGH SCORES MODAL -->
      <div id="scores-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="scores-modal-title">
        <div class="modal-dialog wide-dialog">
          <div class="scores-modal-header">
            <div>
              <h3 id="scores-modal-title" data-i18n="hud.scores_modal.title.label"></h3>
              <span id="scores-progress-summary" class="scores-progress-badge"></span>
            </div>
          </div>
          <div class="scores-filter-bar">
            <input
              id="scores-search-input"
              type="search"
              class="editor-input scores-search-input"
              data-i18n-placeholder="hud.scores_modal.search_placeholder.label"
              data-i18n-aria-label="hud.scores_modal.search_placeholder.label"
            />
            <div class="scores-filter-pills">
              <button id="scores-filter-all" class="hud-btn small active" type="button" aria-pressed="true" data-filter="all" data-i18n="hud.scores_modal.filter_all.action"></button>
              <button id="scores-filter-unsolved" class="hud-btn small" type="button" aria-pressed="false" data-filter="unsolved" data-i18n="hud.scores_modal.filter_unsolved.action"></button>
              <button id="scores-filter-completed" class="hud-btn small" type="button" aria-pressed="false" data-filter="completed" data-i18n="hud.scores_modal.filter_completed.action"></button>
            </div>
          </div>
          <div class="scores-table-wrapper">
            <table class="scores-table">
              <thead>
                <tr>
                  <th data-i18n="hud.scores_modal.col_level.label"></th>
                  <th data-i18n="hud.scores_modal.col_title.label"></th>
                  <th id="scores-col-code" data-i18n="hud.scores_modal.col_code.label"></th>
                  <th id="scores-col-time" data-i18n="hud.scores_modal.col_best_time.label"></th>
                  <th data-i18n="hud.scores_modal.col_best_steps.label"></th>
                  <th data-i18n="hud.scores_modal.col_action.label"></th>
                </tr>
              </thead>
              <tbody id="scores-table-body"></tbody>
            </table>
          </div>
          <div class="modal-actions scores-footer">
            <div class="scores-pack-actions">
              <button id="btn-export-pack-ccl" class="hud-btn small" type="button" data-i18n="app.packs.export_dat_btn.action"></button>
              <button id="btn-delete-pack" class="hud-btn small hidden" type="button" data-i18n="app.packs.delete_btn.action"></button>
            </div>
            <button id="scores-close-btn" class="action-btn" type="button" data-i18n="hud.scores_modal.close_btn.action"></button>
          </div>
        </div>
      </div>

      <!-- HELP & SHORTCUTS MODAL -->
      <div id="help-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
        <div class="modal-dialog wide-dialog">
          <h3 id="help-modal-title" data-i18n="hud.help_modal.title.label"></h3>
          <div class="help-section">
            <h4 data-i18n="hud.help_modal.sec_essentials.label"></h4>
            <ul class="help-list">
              <li data-i18n="hud.help_modal.kb_move.label"></li>
              <li data-i18n="hud.help_modal.kb_undo.label"></li>
              <li data-i18n="hud.help_modal.kb_restart.label"></li>
              <li data-i18n="hud.help_modal.kb_objective.label"></li>
              <li data-i18n="hud.help_modal.kb_solution.label"></li>
            </ul>
          </div>
          <details class="help-more">
            <summary data-i18n="hud.help_modal.more.label"></summary>
            <div class="help-grid">
              <div class="help-section">
                <h4 data-i18n="hud.help_modal.sec_shortcuts.label"></h4>
                <ul class="help-list">
                  <li data-i18n="hud.help_modal.kb_move.label"></li>
                  <li data-i18n="hud.help_modal.kb_click.label"></li>
                  <li data-i18n="hud.help_modal.kb_undo.label"></li>
                  <li data-i18n="hud.help_modal.kb_items.label"></li>
                  <li data-i18n="hud.help_modal.kb_restart.label"></li>
                  <li data-i18n="hud.help_modal.kb_objective.label"></li>
                  <li data-i18n="hud.help_modal.kb_solution.label"></li>
                  <li data-i18n="hud.help_modal.kb_fov_options.label"></li>
                  <li data-i18n="hud.help_modal.kb_graphics.label"></li>
                  <li data-i18n="hud.help_modal.kb_theme.label"></li>
                  <li data-i18n="hud.help_modal.kb_procedural.label"></li>
                  <li data-i18n="hud.help_modal.kb_levels.label"></li>
                </ul>
              </div>
              <div class="help-section">
                <h4 data-i18n="hud.help_modal.sec_rules.label"></h4>
                <ul class="help-list">
                  <li data-i18n="hud.help_modal.rule_keys.label"></li>
                  <li data-i18n="hud.help_modal.rule_buttons.label"></li>
                  <li data-i18n="hud.help_modal.rule_boots.label"></li>
                  <li data-i18n="hud.help_modal.rule_targets.label"></li>
                </ul>
              </div>
            </div>
          </details>
          <div class="modal-actions">
            <button id="help-onboarding-btn" class="action-btn" type="button" data-i18n="hud.help_modal.onboarding_btn.action"></button>
            <button id="help-close-btn" class="action-btn primary" type="button" data-i18n="hud.help_modal.close_btn.action"></button>
          </div>
        </div>
      </div>

      <!-- FIRST-LAUNCH "HOW TO PLAY" MODAL -->
      <div id="onboarding-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="onboarding-modal-title">
        <div class="modal-dialog">
          <h3 id="onboarding-modal-title" data-i18n="hud.onboarding_modal.title.label"></h3>
          <ul class="help-list onboarding-list">
            <li data-i18n="hud.onboarding_modal.move_keys.label"></li>
            <li data-i18n="hud.onboarding_modal.move_touch.label"></li>
            <li data-i18n="hud.onboarding_modal.undo.label"></li>
            <li data-i18n="hud.onboarding_modal.restart.label"></li>
            <li data-i18n="hud.onboarding_modal.objective.label"></li>
            <li data-i18n="hud.onboarding_modal.goal.label"></li>
          </ul>
          <div class="modal-actions">
            <button id="onboarding-close-btn" class="action-btn primary" type="button" data-i18n="hud.onboarding_modal.close_btn.action"></button>
          </div>
        </div>
      </div>

      <!-- CONFIRM MODAL (replaces the browser's own confirm box) -->
      <div id="confirm-modal" class="modal-backdrop hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message">
        <div class="modal-dialog">
          <h3 id="confirm-modal-title"></h3>
          <p id="confirm-modal-message" class="confirm-message"></p>
          <div class="modal-actions">
            <button id="confirm-cancel-btn" class="action-btn" type="button"></button>
            <button id="confirm-ok-btn" class="action-btn primary" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
