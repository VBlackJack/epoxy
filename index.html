<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12151c" />
    <title data-i18n="app.header.title.label"></title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Drag & Drop Overlay for .DAT / .CCL / .JSON / .XSB files -->
      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-card">
          <div data-i18n="app.packs.drop_overlay.label"></div>
          <div class="drop-card-formats" data-i18n="app.packs.import_formats.label"></div>
        </div>
      </div>

      <header class="top-bar">
        <div class="brand-group">
          <h1 class="brand-title" data-i18n="app.header.title.label"></h1>
          <span class="brand-subtitle" data-i18n="app.header.subtitle.label"></span>
          <div class="mobile-header-actions">
            <button id="btn-mobile-fullscreen" class="nav-btn mobile-fs-toggle" type="button" data-i18n="hud.mobile.fullscreen.action"></button>
            <button id="btn-mobile-menu" class="nav-btn mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="options-drawer" data-i18n="app.header.mobile_menu.action"></button>
          </div>
        </div>

        <nav id="top-controls-drawer" class="top-controls">
          <div class="top-controls-row">
            <div class="pack-box">
              <label for="pack-select" data-i18n="app.packs.selector_label.label"></label>
              <select id="pack-select" class="locale-select" data-pack-select></select>
              <button id="btn-levels-modal" class="nav-btn" type="button" data-i18n="app.header.levels_btn.action"></button>
              <button id="btn-header-packs" class="nav-btn" type="button" data-i18n="app.packs.manager.open_btn.action"></button>
              <button id="btn-procedural-pack" class="nav-btn" type="button" data-i18n="app.header.procedural_btn.action"></button>
              <button id="btn-import-pack" class="nav-btn" type="button" data-i18n="app.packs.import_btn.action" data-i18n-title="app.packs.import_formats.label"></button>
              <button id="btn-import-folder" class="nav-btn" type="button" data-i18n="cc2.import.folder.button.label" data-i18n-title="cc2.import.folder.hint.label"></button>
              <button id="btn-delete-imported-packs" class="nav-btn hidden" type="button" data-i18n="app.packs.delete_all_btn.action" data-i18n-title="app.packs.delete_all_btn.title"></button>
              <input id="pack-file-input" type="file" multiple accept=".dat,.ccl,.json,.har,.xsb,.sok,.xml,.c2m,.c2g" class="hidden" />
              <input id="pack-folder-input" type="file" webkitdirectory multiple class="hidden" />
            </div>
            <div id="procedural-seed-box" class="pack-box procedural-seed-box hidden">
              <span id="procedural-seed-label" class="procedural-seed-label"></span>
              <button id="btn-copy-seed" class="nav-btn" type="button" data-i18n="app.packs.procedural_seed_copy.action"></button>
            </div>
          </div>
          <div class="top-controls-row">
            <div class="mode-switch-group">
              <button id="btn-mode-play" class="nav-btn active" type="button" data-i18n="app.header.mode_play.action"></button>
              <button id="btn-mode-editor" class="nav-btn" type="button" data-i18n="app.header.mode_editor.action"></button>
            </div>
            <div class="top-controls-end">
              <button id="btn-fullscreen-toggle" class="nav-btn" type="button" data-i18n="app.header.fullscreen_toggle.action" data-i18n-title="app.header.fullscreen_toggle.hint"></button>
              <button id="btn-help-top" class="nav-btn help-icon-btn" type="button" data-i18n="app.header.help_icon.action" data-i18n-title="app.header.help_btn.hint" data-i18n-aria-label="app.header.help_btn.hint"></button>
              <button id="btn-options-menu" class="nav-btn" type="button" aria-expanded="false" aria-controls="options-drawer" data-i18n="app.header.options_btn.action"></button>
            </div>
          </div>
        </nav>
      </header>

      <!-- SLIDE-OVER OPTIONS DRAWER -->
      <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
      <aside id="options-drawer" class="options-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="options-drawer-title">
        <div class="drawer-header">
          <h3 id="options-drawer-title" data-i18n="app.header.drawer_title.label"></h3>
          <button id="btn-close-drawer" class="hud-btn small" type="button" data-i18n="app.header.drawer_close.action"></button>
        </div>

        <div class="drawer-body">
          <div class="drawer-section drawer-section-navigation">
            <h4 class="drawer-section-title" data-i18n="app.header.drawer_navigation.label"></h4>
            <div class="lang-box drawer-pack-block">
              <label for="drawer-pack-select" data-i18n="app.packs.selector_label.label"></label>
              <select id="drawer-pack-select" class="locale-select" data-pack-select></select>
            </div>
            <div class="drawer-mobile-only">
              <div class="mode-switch-group drawer-mode-switch">
                <button id="btn-drawer-mode-play" class="nav-btn active" type="button" data-i18n="app.header.mode_play.action"></button>
                <button id="btn-drawer-mode-editor" class="nav-btn" type="button" data-i18n="app.header.mode_editor.action"></button>
              </div>
            </div>
            <div id="drawer-seed-box" class="pack-box procedural-seed-box hidden">
              <span id="drawer-seed-label" class="procedural-seed-label"></span>
              <button id="btn-drawer-copy-seed" class="nav-btn" type="button" data-i18n="app.packs.procedural_seed_copy.action"></button>
            </div>
            <button id="btn-drawer-levels" class="nav-btn" type="button" data-i18n="app.header.levels_btn.action"></button>
            <button id="btn-drawer-packs" class="nav-btn" type="button" data-i18n="app.packs.manager.open_btn.action"></button>
            <button id="btn-drawer-procedural" class="nav-btn" type="button" data-i18n="app.header.procedural_btn.action"></button>
            <button id="btn-drawer-import" class="nav-btn" type="button" data-i18n="app.packs.import_btn.action"></button>
            <p class="import-formats-hint" data-i18n="app.packs.import_formats.label"></p>
            <button id="btn-help-modal" class="nav-btn" type="button" data-i18n="app.header.help_btn.action"></button>
          </div>

          <div class="drawer-section">
            <h4 class="drawer-section-title" data-i18n="app.header.drawer_essential.label"></h4>
            <div class="lang-box">
              <label for="select-graphics-style" data-i18n="app.header.graphics_style.label"></label>
              <select id="select-graphics-style" class="locale-select"></select>
            </div>
            <div class="lang-box">
              <label for="fov-select" data-i18n="app.header.fov.label"></label>
              <select id="fov-select" class="locale-select"></select>
            </div>
            <div class="lang-box touch-setting-row">
              <label for="dpad-side-select" data-i18n="app.header.dpad_side.label"></label>
              <select id="dpad-side-select" class="locale-select">
                <option value="left" data-i18n="app.header.dpad_side.left"></option>
                <option value="right" data-i18n="app.header.dpad_side.right"></option>
              </select>
            </div>
            <div class="lang-box touch-setting-row">
              <label for="touch-control-select" data-i18n="app.header.touch_control.label"></label>
              <select id="touch-control-select" class="locale-select">
                <option value="floating" data-i18n="app.header.touch_control.floating"></option>
                <option value="fixed" data-i18n="app.header.touch_control.fixed"></option>
              </select>
            </div>
            <div id="haptics-setting-row" class="lang-box touch-setting-row">
              <button id="btn-haptics-toggle" class="nav-btn active" type="button"></button>
            </div>
            <button id="btn-sfx-toggle" class="nav-btn active" type="button"></button>
            <div id="sfx-volume-row" class="lang-box volume-row">
              <label for="sfx-volume-slider" data-i18n="app.header.sfx_volume.label"></label>
              <input id="sfx-volume-slider" class="volume-slider" type="range">
              <output id="sfx-volume-output" class="volume-output" for="sfx-volume-slider" aria-hidden="true"></output>
            </div>
            <button id="btn-music-toggle" class="nav-btn" type="button"></button>
            <div id="music-volume-row" class="lang-box volume-row">
              <label for="music-volume-slider" data-i18n="app.header.music_volume.label"></label>
              <input id="music-volume-slider" class="volume-slider" type="range">
              <output id="music-volume-output" class="volume-output" for="music-volume-slider" aria-hidden="true"></output>
            </div>
            <div class="lang-box">
              <label for="locale-select" data-i18n="app.header.language.label"></label>
              <select id="locale-select" class="locale-select"></select>
            </div>
          </div>

          <details id="drawer-advanced" class="drawer-section drawer-advanced">
            <summary class="drawer-section-title" data-i18n="app.header.drawer_advanced.label"></summary>
            <div class="lang-box">
              <label for="quality-select" data-i18n="app.header.quality.label"></label>
              <select id="quality-select" class="locale-select"></select>
            </div>
            <div class="lang-box">
              <label for="theme-select" data-i18n="app.header.theme_label.label"></label>
              <select id="theme-select" class="locale-select"></select>
            </div>
            <div class="lang-box">
              <label for="player-skin-select" data-i18n="app.header.player_skin.label"></label>
              <select id="player-skin-select" class="locale-select"></select>
            </div>
            <button id="btn-lcd-toggle" class="nav-btn" type="button" data-i18n="app.header.lcd_toggle.action" data-i18n-title="app.header.lcd_toggle.hint"></button>
            <p id="lcd-toggle-reason" class="hint-text hidden" data-i18n="app.header.lcd_toggle.unavailable"></p>
            <button id="btn-sokoban-skin-toggle" class="nav-btn" type="button" data-i18n="app.header.sokoban_skin_toggle.action" data-i18n-title="app.header.sokoban_skin_toggle.hint"></button>
            <div id="music-mode-row" class="lang-box">
              <label for="music-mode-select" data-i18n="app.music.mode.label"></label>
              <select id="music-mode-select" class="locale-select"></select>
            </div>
            <fieldset id="music-custom-tracks" class="music-tracks" hidden>
              <legend data-i18n="app.music.custom_tracks.label"></legend>
              <div class="music-track-list"></div>
            </fieldset>
            <div class="playtest-options">
              <button id="btn-playtest-toggle" class="nav-btn" type="button" aria-pressed="false" data-i18n="app.playtest.toggle.action" data-i18n-title="app.playtest.toggle.hint"></button>
              <p id="playtest-count" class="hint-text" role="status"></p>
              <div class="playtest-actions">
                <button id="btn-playtest-export" class="nav-btn" type="button" data-i18n="app.playtest.export.action"></button>
                <button id="btn-playtest-clear" class="nav-btn" type="button" data-i18n="app.playtest.clear.action"></button>
              </div>
            </div>
          </details>
        </div>
      </aside>

      <!-- Floating Exit Fullscreen Pill (visible when Fullscreen Mode hides header) -->
      <button id="btn-exit-fullscreen" class="floating-fs-exit hidden" type="button" data-i18n="hud.mobile.exit_fullscreen.action"></button>

      <!-- PLAY VIEW -->
      <main id="play-view" class="view-section">
        <div id="play-console" class="play-shell">
          <!-- Center Screen Bezel (9x9 Viewport + HUD) -->
          <div class="screen-bezel">
            <div class="lcd-screen">
              <div class="viewport-wrapper">
                <canvas id="game-canvas" width="676" height="676" role="img" data-i18n-aria-label="hud.viewport.canvas.label"></canvas>

                <!-- Hint Overlay -->
                <div id="hint-banner" class="hint-banner hidden" role="status" aria-live="polite">
                  <strong data-i18n="hud.messages.hint_prefix.label"></strong>
                  <span id="hint-text"></span>
                </div>

                <!-- Banner of a level imported from CC2 that holds mechanics Epoxy does not play -->
                <div id="cc2-banner" class="cc2-banner hidden" role="status" tabindex="0" aria-expanded="false"></div>

                <!-- Status Toast Banner -->
                <div id="status-toast" class="status-toast hidden" role="status" aria-live="polite"></div>

                <!-- Tile & Entity Inspection Badge -->
                <div id="inspect-pill" class="inspect-pill hidden"></div>

                <!-- Modal Overlay Inside Viewport (Pause / Death / Win) -->
                <div id="viewport-overlay" class="viewport-overlay hidden" role="alertdialog" aria-labelledby="overlay-title" aria-describedby="overlay-subtitle">
                  <div class="overlay-card">
                    <h2 id="overlay-title"></h2>
                    <p id="overlay-subtitle"></p>
                    <p id="overlay-extra" class="overlay-extra"></p>
                    <div class="overlay-actions">
                      <button id="overlay-btn-resume" class="action-btn primary hidden" type="button" data-i18n="hud.messages.resume_action.action" data-i18n-title="hud.messages.resume_action.hint"></button>
                      <button id="overlay-btn-back-to-editor" class="action-btn primary hidden" type="button" data-i18n="editor.pack.back_to_editor.action"></button>
                      <button id="overlay-btn-next" class="action-btn primary hidden" type="button" data-i18n="hud.messages.next_action.action" data-i18n-title="hud.messages.next_action.hint"></button>
                      <button id="overlay-btn-rate" class="action-btn hidden" type="button" aria-haspopup="dialog" data-i18n="app.playtest.rating.open.action"></button>
                      <button id="overlay-btn-play-epoxy" class="action-btn primary hidden" type="button" data-i18n="tutorial.ui.complete.play_epoxy.action"></button>
                      <button id="overlay-btn-replay" class="action-btn hidden" type="button" data-i18n="hud.messages.replay_action.action"></button>
                      <button id="overlay-btn-undo" class="action-btn" type="button" data-i18n="hud.controls.undo.action" data-i18n-title="hud.controls.undo.hint"></button>
                      <button id="overlay-btn-retry" class="action-btn" type="button" data-i18n="hud.controls.restart.action" data-i18n-title="hud.controls.restart.hint"></button>
                      <button id="overlay-btn-hint" class="action-btn hidden" type="button" data-i18n="hud.controls.objective.action" data-i18n-title="hud.controls.objective.hint"></button>
                      <button id="overlay-btn-solution" class="action-btn hidden" type="button" data-i18n="hud.controls.solution.action" data-i18n-title="hud.controls.solution.hint"></button>
                      <button id="overlay-btn-options" class="action-btn hidden" type="button" aria-haspopup="dialog" data-i18n="app.header.options_btn.action"></button>
                      <button id="overlay-btn-exit-fullscreen" class="action-btn hidden" type="button" data-i18n="hud.mobile.exit_fullscreen.action"></button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Ergonomic Smartphone & Touch Controller Bar -->
              <div id="mobile-touch-bar" class="mobile-touch-bar">
                <div class="mobile-dpad-zone">
                  <div class="dpad-container mobile-dpad">
                    <button class="dpad-btn dpad-up" data-dir="N" type="button" data-i18n-aria-label="hud.mobile.dpad_up.label"><span aria-hidden="true">▲</span></button>
                    <button class="dpad-btn dpad-left" data-dir="W" type="button" data-i18n-aria-label="hud.mobile.dpad_left.label"><span aria-hidden="true">◀</span></button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn dpad-right" data-dir="E" type="button" data-i18n-aria-label="hud.mobile.dpad_right.label"><span aria-hidden="true">▶</span></button>
                    <button class="dpad-btn dpad-down" data-dir="S" type="button" data-i18n-aria-label="hud.mobile.dpad_down.label"><span aria-hidden="true">▼</span></button>
                  </div>
                </div>

                <div class="mobile-actions-zone">
                  <div class="mobile-action-grid">
                    <button id="mobile-btn-undo" class="mobile-pad-btn" type="button" data-i18n="hud.mobile.undo.action"></button>
                    <button id="mobile-btn-objective" class="mobile-pad-btn accent" type="button" data-i18n="hud.mobile.objective.action"></button>
                    <button id="mobile-btn-restart" class="mobile-pad-btn" type="button" data-i18n="hud.mobile.restart.action"></button>
                    <button id="mobile-btn-fullscreen" class="mobile-pad-btn" type="button" data-i18n="hud.mobile.fullscreen.action"></button>
                    <button id="mobile-btn-solution" class="mobile-pad-btn span-full" type="button" data-i18n="hud.mobile.solution.action"></button>
                  </div>
                  <div class="mobile-gesture-caption" data-i18n="hud.mobile.gesture_hint.label"></div>
                </div>
              </div>

              <!-- Floating joystick zone of the phone layout (hidden elsewhere) -->
              <div id="joystick-zone" class="joystick-zone" aria-hidden="true"></div>

              <!-- Status strip of the phone drawer layout (hidden elsewhere) -->
              <div id="touch-strip" class="touch-strip" role="group" data-i18n-aria-label="hud.touch_overlay.strip.label">
                <button id="touch-tab-level" class="touch-strip-tab" type="button" aria-haspopup="dialog" data-i18n-aria-label="hud.touch_overlay.tab.level.label" data-i18n-title="hud.touch_overlay.tab.level.label"><svg class="touch-overlay-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M14 6l-6 6 6 6"/></svg></button>
                <span id="touch-strip-level" class="touch-strip-level"></span>
                <span id="touch-strip-count" class="touch-strip-count" role="img"><span id="touch-strip-count-label" class="touch-strip-label" aria-hidden="true"></span> <span id="touch-strip-count-value" class="touch-strip-value led-green" aria-hidden="true"></span></span>
                <span id="touch-strip-time" class="touch-strip-time" role="img"><span class="touch-strip-label" aria-hidden="true" data-i18n="hud.touch_overlay.time.short"></span> <span id="touch-strip-time-value" class="touch-strip-value led-amber" aria-hidden="true"></span></span>
                <button id="touch-tab-menu" class="touch-strip-tab" type="button" aria-haspopup="dialog" data-i18n-aria-label="hud.touch_overlay.tab.menu.label" data-i18n-title="hud.touch_overlay.tab.menu.label"><svg class="touch-overlay-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M5 7h14M5 12h14M5 17h14"/></svg></button>
              </div>

              <div id="touch-drawer-scrim" class="touch-drawer-scrim hidden"></div>

              <!-- Right drawer of the phone layout: game menu -->
              <aside id="touch-menu-drawer" class="touch-menu-drawer hidden">
                <div class="touch-drawer-head">
                  <h2 id="touch-menu-title" class="touch-drawer-title" data-i18n="hud.touch_overlay.drawer.menu.title"></h2>
                  <button id="touch-menu-close" class="touch-drawer-close" type="button" data-i18n="hud.touch_overlay.drawer.close.action"></button>
                </div>
                <div class="touch-drawer-actions">
                  <button id="touch-menu-resume" class="hud-btn primary" type="button" data-i18n="hud.touch_overlay.menu_drawer.resume.action"></button>
                  <button id="touch-menu-undo" class="hud-btn" type="button" data-i18n="hud.controls.undo.action" data-i18n-title="hud.controls.undo.hint"></button>
                  <button id="touch-menu-restart" class="hud-btn" type="button" data-i18n="hud.controls.restart.action" data-i18n-title="hud.controls.restart.hint"></button>
                  <button id="touch-menu-hint" class="hud-btn" type="button" data-i18n="hud.controls.objective.action" data-i18n-title="hud.controls.objective.hint"></button>
                  <button id="touch-menu-solution" class="hud-btn" type="button" data-i18n="hud.controls.solution.action" data-i18n-title="hud.controls.solution.hint"></button>
                  <div class="touch-drawer-field">
                    <label for="touch-style-select" data-i18n="app.header.graphics_style.label"></label>
                    <select id="touch-style-select" class="locale-select"></select>
                  </div>
                  <button id="touch-menu-options" class="hud-btn" type="button" aria-haspopup="dialog" data-i18n="hud.touch_overlay.menu_drawer.all_options.action"></button>
                  <button id="touch-menu-levels" class="hud-btn" type="button" aria-haspopup="dialog" data-i18n="hud.touch_overlay.menu_drawer.levels.action"></button>
                  <button id="touch-menu-tutorial" class="hud-btn hidden" type="button" data-tutorial-entry data-i18n="tutorial.ui.drawer.button.action"></button>
                  <button id="touch-menu-exit-fullscreen" class="hud-btn" type="button" data-i18n="hud.touch_overlay.menu_drawer.exit_fullscreen.action"></button>
                </div>
              </aside>

              <!-- Side HUD Panel -->
              <aside class="hud-panel">
                <div class="touch-drawer-head">
                  <h2 id="touch-level-title" class="touch-drawer-title" data-i18n="hud.touch_overlay.drawer.level.title"></h2>
                  <button id="touch-level-close" class="touch-drawer-close" type="button" data-i18n="hud.touch_overlay.drawer.close.action"></button>
                </div>
                <div class="hud-level-header">
                  <div class="hud-level-badge">
                    <span data-i18n="hud.stats.level.label"></span>
                    <strong id="hud-level-num"></strong>
                  </div>
                  <button id="hud-password-badge" class="hud-password-badge" type="button" aria-haspopup="dialog" data-i18n-aria-label="hud.controls.password_badge.label" data-i18n-title="hud.controls.password_btn.action">
                    <span data-i18n="hud.stats.password.label"></span>
                    <strong id="hud-level-pass"></strong>
                    <span class="hud-password-edit" aria-hidden="true">&#9998;</span>
                  </button>
                </div>
                <span id="hud-playtest-badge" class="hud-playtest-badge hidden" data-i18n="app.playtest.badge.label" data-i18n-title="app.playtest.badge.hint"></span>
                <div class="hud-level-title"><span id="hud-level-name" class="hud-level-name"></span><span id="hud-level-author" class="hud-level-author hidden"></span></div>

                <div class="led-counters">
                  <div class="led-box">
                    <span id="hud-chips-label" class="led-label"><span class="led-label-long" data-i18n="hud.stats.chips.label"></span><span class="led-label-short" aria-hidden="true" data-i18n="hud.touch_overlay.chips.short"></span></span>
                    <span id="hud-targets-label" class="led-label hidden"><span class="led-label-long" data-i18n="hud.stats.targets.label"></span><span class="led-label-short" aria-hidden="true" data-i18n="hud.touch_overlay.targets.short"></span></span>
                    <span id="hud-receivers-label" class="led-label hidden"><span class="led-label-long" data-i18n="hud.stats.receivers.label"></span><span class="led-label-short" aria-hidden="true" data-i18n="hud.touch_overlay.receivers.short"></span></span>

          <p id="share-preview-author" class="hint-text hidden"></p>
          <p id="share-preview-description" class="share-preview-description hidden"></p>
          <p class="share-preview-meta"><span id="share-preview-count"></span> <span id="share-preview-badges" class="packs-badges"></span></p>
          <div id="share-preview-thumbs" class="share-preview-thumbs" aria-hidden="true"></div>
          <p id="share-preview-status" class="share-preview-status hidden" role="status" data-i18n="app.packs.share.preview.duplicate.label"></p>
          <div class="modal-actions">
            <button id="share-preview-cancel-btn" class="action-btn" type="button" data-i18n="app.packs.share.preview.cancel.action"></button>
            <button id="share-preview-play-btn" class="action-btn primary hidden" type="button" data-i18n="app.packs.share.preview.play.action"></button>
            <button id="share-preview-import-btn" class="action-btn" type="button" data-i18n="app.packs.share.preview.import.action"></button>
            <button id="share-preview-import-play-btn" class="action-btn primary" type="button" data-i18n="app.packs.share.preview.import_play.action"></button>
          </div>
        </div>
      </div>

      <!-- SHARE LINK: selectable copy of the link where the clipboard is not available -->
      <div id="share-link-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="share-link-title">
        <div class="modal-dialog">
          <h3 id="share-link-title" data-i18n="app.packs.share.fallback.title.label"></h3>
          <p class="hint-text" data-i18n="app.packs.share.fallback.hint.label"></p>
          <input id="share-link-field" type="text" class="editor-input" readonly autocomplete="off" spellcheck="false" data-i18n-aria-label="app.packs.share.fallback.field.label" />
          <div class="modal-actions">
            <button id="share-link-close-btn" class="action-btn primary" type="button" data-i18n="app.packs.share.fallback.close.action"></button>
          </div>
        </div>
      </div>

      <!-- SAVE INTO... -->
      <div id="save-into-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="save-into-title">
        <form id="save-into-form" class="modal-dialog save-into-dialog">
          <h3 id="save-into-title" data-i18n="editor.pack.save_into.title.label"></h3>
          <fieldset class="save-into-fieldset">
            <legend data-i18n="editor.pack.save_into.legend.label"></legend>
            <div id="save-into-list" class="save-into-list"></div>
            <div class="save-into-new">
              <input id="save-into-new-radio" type="radio" name="save-into-choice" value="" />
              <label for="save-into-new-radio" data-i18n="editor.pack.save_into.new_pack.label"></label>
              <input id="save-into-new-name" type="text" class="editor-input" autocomplete="off" data-i18n-aria-label="editor.pack.save_into.new_name.label" />
            </div>
          </fieldset>
          <div class="modal-actions">
            <button id="save-into-cancel-btn" class="action-btn" type="button" data-i18n="app.confirm.cancel.action"></button>
            <button id="save-into-submit-btn" class="action-btn primary" type="submit" data-i18n="editor.pack.save_into.submit.action"></button>
          </div>
        </form>
      </div>

      <!-- PLAYTEST RATING: short, dismissable; Escape skips it -->
      <div id="playtest-rating-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="playtest-rating-title">
        <form id="playtest-rating-form" class="modal-dialog playtest-rating-dialog">
          <h3 id="playtest-rating-title" data-i18n="app.playtest.rating.title.label"></h3>
          <p id="playtest-rating-level" class="hint-text"></p>
          <fieldset class="playtest-fieldset">
            <legend data-i18n="app.playtest.rating.difficulty.label"></legend>
            <div class="playtest-scale">
              <span class="hint-text" data-i18n="app.playtest.rating.difficulty_low.label"></span>
              <div id="playtest-rating-difficulty" class="playtest-scale-options"></div>
              <span class="hint-text" data-i18n="app.playtest.rating.difficulty_high.label"></span>
            </div>
          </fieldset>
          <fieldset class="playtest-fieldset">
            <legend data-i18n="app.playtest.rating.fun.label"></legend>
            <div class="playtest-scale">
              <span class="hint-text" data-i18n="app.playtest.rating.fun_low.label"></span>
              <div id="playtest-rating-fun" class="playtest-scale-options"></div>
              <span class="hint-text" data-i18n="app.playtest.rating.fun_high.label"></span>
            </div>
          </fieldset>
          <fieldset class="playtest-fieldset">
            <legend data-i18n="app.playtest.rating.aha.label"></legend>
            <div class="playtest-scale-options">
              <label class="playtest-scale-option"><input type="radio" name="playtest-rating-aha" value="yes" /><span data-i18n="app.playtest.rating.aha_yes.action"></span></label>
              <label class="playtest-scale-option"><input type="radio" name="playtest-rating-aha" value="no" /><span data-i18n="app.playtest.rating.aha_no.action"></span></label>
            </div>
          </fieldset>
          <label for="playtest-rating-note" data-i18n="app.playtest.rating.note.label"></label>
          <textarea id="playtest-rating-note" class="editor-input playtest-note" rows="2" autocomplete="off"></textarea>
          <div class="modal-actions">
            <button id="playtest-rating-skip-btn" class="action-btn" type="button" data-i18n="app.playtest.rating.skip.action"></button>
            <button id="playtest-rating-submit-btn" class="action-btn primary" type="submit" data-i18n="app.playtest.rating.submit.action"></button>
          </div>
        </form>
      </div>

      <!-- CONFIRM MODAL (replaces the browser's own confirm box) -->
      <div id="confirm-modal" class="modal-backdrop hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message">
        <div class="modal-dialog">
          <h3 id="confirm-modal-title"></h3>
          <p id="confirm-modal-message" class="confirm-message"></p>
          <div class="modal-actions">
            <button id="confirm-cancel-btn" class="action-btn" type="button"></button>
            <button id="confirm-ok-btn" class="action-btn primary" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
